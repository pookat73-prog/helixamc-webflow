name: Export isolated medicine candidate (temporary)
on:
  push:
    branches: [claude/mobile-speed-validation-20261019]
    paths: [.github/workflows/export-medicine-candidate.yml]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helix-medicine-image-audit
          run-id: 39263094775
          github-token: ${{ github.token }}
          path: candidate
      - run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          data=base64.b64encode(Path('candidate/quality95.webp').read_bytes()).decode()
          for i,off in enumerate(range(0,len(data),12000)):print('WEBP_CHUNK '+str(i)+' '+data[off:off+12000])
          PY
      - run: |
          node --input-type=module <<'JS'
          const html=await (await fetch('https://www.helix-amc.com/services')).text();
          const urls=[...html.matchAll(/href="([^"]+\.css[^"]*)"/g)].map(x=>x[1]);
          for(const url of urls){
            const css=await(await fetch(url)).text();
            for(const match of css.matchAll(/[^{}]*\{[^{}]*6a45e8bd91b794ab174bf80a[^{}]*\}/g))console.log('ORIGINAL_CSS_RULE '+match[0]);
          }
          JS
