name: Mobile speed and browser validation (temporary)
on:
  push:
    branches: [claude/mobile-speed-validation-20261019]
    paths: [.github/workflows/mobile-speed-audit.yml, .github/scripts/mobile-speed-verify.mjs, .github/scripts/mobile-lighthouse.mjs]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser audit tools
        run: npm install --prefix /tmp/helix-ci-audit --no-audit --no-fund playwright@1.64.1 lighthouse@13.5.0 pixelmatch@8.0.0 pngjs@7.0.0
      - name: Install Chromium
        run: /tmp/helix-ci-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare staging screens and test menus and consultation windows
        run: node .github/scripts/mobile-speed-verify.mjs
      - name: Measure production mobile performance three times per page
        if: always()
        run: node .github/scripts/mobile-lighthouse.mjs
      - name: Save screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-mobile-audit
          path: audit-results/
          retention-days: 14
