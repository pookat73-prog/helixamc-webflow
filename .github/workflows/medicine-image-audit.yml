name: Audit medicine image encoding (temporary)
on:
  push:
    branches: [claude/mobile-speed-validation-20261019]
    paths: [.github/workflows/medicine-image-audit.yml, .github/scripts/medicine-image-audit.mjs]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix /tmp/helix-ci-audit --no-audit --no-fund playwright@1.64.1 sharp@0.34.5 pixelmatch@8.0.0 pngjs@7.0.0
      - run: /tmp/helix-ci-audit/node_modules/.bin/playwright install --with-deps chromium
      - run: node .github/scripts/medicine-image-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helix-medicine-image-audit
          path: image-results/
          retention-days: 14
      - name: Export compact image evidence
        if: always()
        run: |
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import io,zipfile,base64
          root=Path('image-results')
          for width in [390,1440]:
              canvas=Image.new('RGB',(1000,650),'#eeeeee');draw=ImageDraw.Draw(canvas)
              for i,variant in enumerate(['baseline','candidate']):
                  f=root/f'{width}-{variant}-image.png'
                  if not f.exists():continue
                  im=Image.open(f).convert('RGB');im.thumbnail((500,620));canvas.paste(im,(500*i,30));draw.text((500*i+5,5),f'{width}px {variant}',fill='black')
              canvas.save(root/f'compare-{width}.jpg',quality=95)
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in list(root.glob('*.json'))+list(root.glob('*.jpg')):
                  if f.name!='original.jpg':z.write(f,f.name)
          encoded=base64.b64encode(buf.getvalue()).decode('ascii')
          for i,off in enumerate(range(0,len(encoded),12000)):print('IMAGE_EXPORT_CHUNK '+str(i)+' '+encoded[off:off+12000])
          PY
