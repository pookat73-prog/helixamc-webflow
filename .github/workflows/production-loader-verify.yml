name: Verify production debug loader release (temporary)
on:
  push:
    branches: [claude/mobile-speed-validation-20261019]
    paths: [.github/workflows/production-loader-verify.yml, .github/scripts/production-loader-verify.mjs]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: helix-mobile-audit
          run-id: 39229239769
          github-token: ${{ github.token }}
          path: /tmp/pre-deploy/
      - run: npm install --prefix /tmp/helix-ci-audit --no-audit --no-fund playwright@1.64.1 pixelmatch@8.0.0 pngjs@7.0.0
      - run: /tmp/helix-ci-audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify production loading and visible UI
        run: node .github/scripts/production-loader-verify.mjs
      - name: Save full production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-production-verification
          path: audit-results/
          retention-days: 14
      - name: Export compact production evidence
        if: always()
        run: |
          python -m pip install --quiet pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import io,zipfile,base64
          root=Path('audit-results')
          groups={'production-post':[f'production-{p}-{w}-post-home.png' for p in ['home','services'] for w in [390,1440]],'production-interactions':[f'production-{p}-390-post-{v}.png' for p in ['home','services'] for v in ['menu','consultation']]}
          for group,names in groups.items():
              width,height=(720,870) if group=='production-post' else (390,870)
              canvas=Image.new('RGB',(2*width,2*height),'#eeeeee');draw=ImageDraw.Draw(canvas)
              for i,name in enumerate(names):
                  file=root/name
                  if not file.exists(): continue
                  im=Image.open(file).convert('RGB');im.thumbnail((width,height-26));x,y=i%2*width,i//2*height
                  canvas.paste(im,(x,y+26));draw.text((x+5,y+5),name,fill='#000000')
              canvas.save(root/(group+'.jpg'),quality=85,optimize=True)
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in list(root.glob('*.json'))+list(root.glob('*.jpg')): z.write(f,f.name)
          encoded=base64.b64encode(buf.getvalue()).decode('ascii')
          for i,off in enumerate(range(0,len(encoded),12000)): print('PROD_EXPORT_CHUNK '+str(i)+' '+encoded[off:off+12000])
          PY
