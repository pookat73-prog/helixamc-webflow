name: Export mobile audit evidence (temporary)
on:
  push:
    branches: [claude/mobile-speed-validation-20261019]
    paths: [.github/workflows/export-mobile-audit.yml, .github/scripts/export-mobile-audit.py]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: helix-mobile-audit
          run-id: 39229239769
          github-token: ${{ github.token }}
          path: audit-results/
      - run: python -m pip install --quiet pillow==11.3.0
      - run: python .github/scripts/export-mobile-audit.py
