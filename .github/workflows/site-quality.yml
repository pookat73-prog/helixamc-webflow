name: Site Quality Checks

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: JavaScript and accessibility contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run site quality checks
        run: node scripts/check-site-quality.mjs

      - name: Test About loading priority and version lookup failures
        run: node scripts/test-about-bootstrap.mjs

      - name: Test floating CTA Firebase submission
        run: node scripts/test-floating-cta-submit.mjs

      - name: Test dynamic section measurement without sending analytics
        run: node scripts/test-section-reach.mjs

      - name: Test surgery CTA attribution and analytics exclusion without network
        run: node scripts/test-surgery-cta-measurement.mjs

      - name: Test shared analytics coverage, reading clocks and transport fallbacks
        run: node scripts/test-measurement-coverage.mjs

      - name: Test quickbar and Ilsan schedule attribution
        run: |
          node scripts/test-quickbar-measurement.mjs
          node scripts/test-ilsan-schedule-measurement.mjs
