name: Site Quality Checks

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.head_ref != 'qa/helix-p1-webkit-20261124'
    name: JavaScript and accessibility contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run site quality checks
        run: node scripts/check-site-quality.mjs

      - name: Test About loading priority and version lookup failures
        run: node scripts/test-about-bootstrap.mjs

      - name: Test floating CTA Firebase submission
        run: node scripts/test-floating-cta-submit.mjs

      - name: Test dynamic section measurement without sending analytics
        run: node scripts/test-section-reach.mjs

      - name: Test surgery CTA attribution and analytics exclusion without network
        run: node scripts/test-surgery-cta-measurement.mjs

      - name: Test shared analytics coverage, reading clocks and transport fallbacks
        run: node scripts/test-measurement-coverage.mjs

      - name: Test quickbar and Ilsan schedule attribution
        run: |
          node scripts/test-quickbar-measurement.mjs
          node scripts/test-ilsan-schedule-measurement.mjs
          node scripts/test-home-faq-measurement.mjs
          node scripts/test-footer-email-measurement.mjs

      - name: Validate static doctor pages and single source data
        run: node scripts/test-doctor-pages.mjs

      - name: Test floating CTA keyboard focus
        run: node scripts/test-floating-cta-focus.mjs

  reservation-webkit:
    name: Reservation inputs on WebKit iPhone profile
    if: github.event_name == 'pull_request' && github.head_ref == 'qa/helix-p1-webkit-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout QA candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing Playwright WebKit version
        run: |
          npm install --prefix "$RUNNER_TEMP/helix-p1-pw" --no-save playwright@1.62.1
          "$RUNNER_TEMP/helix-p1-pw/node_modules/.bin/playwright" install --with-deps webkit
          command -v xclip >/dev/null || sudo apt-get install -y xclip

      - name: Verify published staging reservation input without external writes
        run: |
          export NODE_PATH="$RUNNER_TEMP/helix-p1-pw/node_modules"
          xvfb-run -a node scripts/test-p1-webkit-staging.cjs
