name: Site Quality Checks

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: JavaScript and accessibility contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run site quality checks
        run: node scripts/check-site-quality.mjs

      - name: Validate static doctor pages and single source data
        run: node scripts/test-doctor-pages.mjs

      - name: Test floating CTA Firebase submission
        run: node scripts/test-floating-cta-submit.mjs

      - name: Test floating CTA keyboard focus
        run: node scripts/test-floating-cta-focus.mjs
