b945"}];
          function inlineHash(html){
           const scope=html.slice(html.search(/<body\b/i),html.search(/<\/body>/i));
           const codes=[...scope.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
             .filter(x=>!/\bsrc\s*=/.test(x[1])&&!/window\.__helixSharedUiEntry|Booking submission is disabled on Webflow staging\./.test(x[2]))
             .map(x=>[x[1].trim(),x[2].trim()]);
           return hash(JSON.stringify(codes));
          }
          (async()=>{
           const changed=[];
           for(let i=0;i<archived.length;i+=5)await Promise.all(archived.slice(i,i+5).map(async({route,sha})=>{
             const res=await fetch('https://helixanimalmedicalcenter.webflow.io'+route,{method:'GET',redirect:'error',signal:AbortSignal.timeout(20000)});
             if(!res.ok)throw Error('HTTP '+res.status+' '+route);
             const body=await res.text();
             if(!/Last Published:\s*Mon Nov 23 2026 07:34:/.test(body))throw Error('Unexpected staging revision '+route);
             if(inlineHash(body)!==sha)changed.push(route);
           }));
           console.log('INLINE_SCOPE '+JSON.stringify({count:archived.length,unchanged:archived.length-changed.length,changed}));
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          HELIX_SCOPE
