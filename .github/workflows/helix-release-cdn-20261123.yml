    branches:
      - release/helix-structure-20261123
    paths:
      - .github/workflows/helix-release-cdn-20261123.yml
permissions:
  contents: read
jobs:
  published-scope:
    name: Read-only comparison of published staging assets
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Compare public HTML structure and generated CSS
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'pookat73-prog/helixamc-webflow' && "$GITHUB_REF" == 'refs/heads/release/helix-structure-20261123' ]]
          node <<'HELIX_SCOPE'
          'use strict';
          const hash=x=>require('node:crypto').createHash('sha256').update(x).digest('hex');
          const archived=[{"route":"/surgery","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/discover-helix","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/seocho","sha":"5775426b7211d054a72de1441d935eb374f9560337b15d31c649ac04200c0458"},{"route":"/services","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/specialty-care","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/symptoms","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/faq","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/ilsan","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/gimtaeseong","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/diagnostic-imaging","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/internal-medicine","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/joseongu","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/jeonjonghyi","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/sonyeongmin","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/hongyiju","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/seongcanju","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/imjihyeon","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/jangmunseog","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},{"route":"/doctors/gimhyoju","sha":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e