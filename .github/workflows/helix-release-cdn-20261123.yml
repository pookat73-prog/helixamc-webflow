           const footerRx=/<script\b[^>]*>[\s\S]*?<\/script>/gi;
           const body=html.slice(start,end).replace(footerRx, tag=>/window\.__helixSharedUiEntry|Booking submission is disabled on Webflow staging\./.test(tag)?'':tag).trimEnd();
           const structural=body.replace(footerRx,'').replace(/\s*<!-- HELIX shared UI: complete missing page modules from an immutable revision\. -->/g,'').trimEnd();
           const staticScripts=[...body.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)].map(x=>x[1]).sort();
           const sharedCSS=[...new Set([...html.matchAll(/https:\/\/cdn\.prod\.website-files\.com\/[0-9a-f]+\/css\/[^"'\s<>]*\.webflow\.shared\.[^"'\s<>]+\.css/gi)].map(x=>x[0]))].sort();
           return {body:digest(structural),bodyWithScripts:digest(body),staticScripts:digest(JSON.stringify(staticScripts)),sharedCSS};
          }
          async function get(url) {
             const parsed=new URL(url);
             assert.ok(parsed.origin===stage||parsed.origin==='https://cdn.prod.website-files.com');
             if(parsed.origin!==stage)assert.match(parsed.pathname,/^\/[0-9a-f]+\/css\/[a-z0-9._-]+\.css$/i);
             const res=await fetch(url,{method:'GET',redirect:'error',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(24000)});
             if(res.status!==200)throw Error('Unexpected '+res.status+' '+parsed.pathname);
             return Buffer.from(await res.arrayBuffer());
           }
           (async()=>{
             const styles=new Map();
             const report=[];
             for(let at=0;at<archived.length;at+=5){
               await Promise.all(archived.slice(at,at+5).map(async old=>{
                 const html=(await get(stage+old.route)).toString('utf8');
                 const mark=html.match(/Last Published:\s*([^<]+?)\s*-->/i)?.[1];
                 assert.ok(mark&&mark.includes('07:34:48')||mark&&/^Mon Nov 23 2026 07:34:/.test(mark),old.route+' version timestamp '+mark);
                 const now=signatures(html);
                 assert.ok(now.sharedCSS.length>0,'No generated shared CSS on '+old.route);
                 for(const url of now.sharedCSS){
                   if(!styles.has(url))styles.set(url,new Set());
                   styles.get(url).add(old.route);
                 }
                 report.push({route:old.route,bodyUnchanged:old.body===now.body,bodyScriptsUnchanged:old.bodyWithScripts===now.bodyWithScripts,staticScriptsUnchanged:old.staticScripts===now.staticScripts});
               }));
             }
             const rows=[];
             for(const [url,routes] of styles){
               const bytes=await get(url);
               const sha=digest(bytes);
               rows.push({url,sha,routes:routes.size,oldStageURL:url===knownStage,oldStageBytes:sha===oldStageDigest,productionURL:url===knownProduction,productionBytes:sha===oldProductionDigest});
             }
             const result={routes:report.length,bodyUnchanged:report.filter(x=>x.bodyUnchanged).length,bodyScriptsUnchanged:report.filter(x=>x.bodyScriptsUnchanged).length,staticScriptsUnchanged:report.filter(x=>x.staticScriptsUnchanged).length,mutations:report.filter(x=>!x.bodyUnchanged||!x.staticScriptsUnchanged),css:rows};
             console.log('DELTA_SCOPE '+JSON.stringify(result));
           })().catch(e=>{console.error(e.message);process.exitCode=1;});
