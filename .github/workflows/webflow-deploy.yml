name: Webflow CDN Auto Deploy

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'home/**'
      - 'about/**'
      - 'global/**'
      - 'seocho/**'
      - 'emergency/**'
  workflow_dispatch:

permissions:
  contents: write   # _all.json 자동 커밋용

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild doctors bundle (_all.json)
        run: |
          # 의료진 개별 JSON 들을 하나의 _all.json 으로 합쳐 jsDelivr 라운드트립
          # 39회 → 1회 로 줄임. 변경 있으면 자동 커밋·푸시 후 워크플로우는 그대로
          # 새 SHA 기준으로 계속 진행.
          node scripts/build-doctors-bundle.js
          if ! git diff --quiet -- seocho/doctors/data/_all.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seocho/doctors/data/_all.json
            git commit -m "chore(doctors): rebuild _all.json bundle [auto]"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "→ _all.json 변경 감지·자동 커밋. 새 커밋이 본 워크플로우를 재트리거함."
          else
            echo "→ _all.json 변경 없음 (개별 JSON 변경 없는 푸시)"
          fi

      - name: Determine target ref
        id: ref
        run: |
          # 푸시된 브랜치 이름 추출. workflow_dispatch 면 main 기본.
          BRANCH="${GITHUB_REF_NAME:-main}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "→ deploying for branch: $BRANCH"

      - name: Build reference head code (main only)
        if: steps.ref.outputs.branch == 'main'
        run: |
          # 정식 페이지에 붙일 head code (요약 출력용).
          # bootstrap.js 가 hostname 기반으로 @staging / @main 분기하므로
          # head code 는 한 종류만 두 환경에 그대로 사용 가능.
          cat > /tmp/head_cdn.txt <<'EOF'
          <!-- GSAP -->
          <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

          <!-- Helix Auto-Loader (loads latest commit dynamically) -->
          <script src="https://cdn.jsdelivr.net/gh/pookat73-prog/helixamc-webflow@main/home/bootstrap.js"></script>
          EOF
          echo "--- Generated head code ---"
          cat /tmp/head_cdn.txt
          echo "---"

      - name: Purge jsDelivr cache for bootstrap.js (target ref only)
        run: |
          # 푸시된 ref(main 또는 staging) 의 bootstrap.js 캐시 퍼지.
          # ⚠️ 콘텐츠 파일도 일부 퍼지: bootstrap 은 정상 시 @<SHA>(immutable)
          # 로 로드하지만, GitHub API 한도 초과 등으로 실패하면 @<REF> 브랜치
          # ref 로 폴백한다. 브랜치 ref 캐시는 최대 12h stale 이므로 폴백 시
          # 구버전이 떠서, seocho 콘텐츠는 브랜치 ref 캐시도 함께 퍼지한다.
          REF="${{ steps.ref.outputs.branch }}"
          BASE="https://purge.jsdelivr.net/gh/pookat73-prog/helixamc-webflow@${REF}"
          FILES=(
            "home/bootstrap.js"
            "home/bootstrap-v2.js"
            "home/bootstrap-v3.js"
            "about/bootstrap.js"
            "global/bootstrap.js"
            "seocho/bootstrap.js"
            "emergency/bootstrap.js"
            "emergency/emergency.css"
            "emergency/emergency.js"
            "emergency/modal.css"
            "emergency/modal.js"
            "emergency/renewal-bar.css"
            "emergency/renewal-bar.js"
            "emergency/branch-cta.css"
            "emergency/branch-cta.js"
            "emergency/data/dyspnea.json"
            "emergency/data/seizure.json"
            "emergency/data/paralysis.json"
            "emergency/data/collapse.json"
            "emergency/data/hyperthermia.json"
            "emergency/data/hypothermia.json"
            "emergency/data/syncope.json"
            "emergency/data/shock.json"
            "emergency/data/severe-pain.json"
            "emergency/data/hemorrhage.json"
            "emergency/data/proptosis.json"
            "seocho/seocho.css"
            "seocho/seocho.js"
            "seocho/doctors/card-render.js"
            "seocho/doctors/modal.js"
            "seocho/doctors/modal.css"
            "seocho/doctors/data/_all.json"
            "seocho/doctors/data/im-1/_index.json"
            "seocho/doctors/data/im-1/gimtaeseong.json"
            "seocho/doctors/data/im-1/jeonjonghyi.json"
            "seocho/doctors/data/im-1/seongcanju.json"
            "seocho/doctors/data/im-2/_index.json"
            "seocho/doctors/data/im-2/joseongu.json"
            "seocho/doctors/data/im-2/sonyeongmin.json"
            "seocho/doctors/data/im-2/hongyiju.json"
            "seocho/doctors/data/im-2/jangmunseog.json"
            "seocho/doctors/data/im-2/imjihyeon.json"
            "seocho/doctors/data/sr-1/_index.json"
            "seocho/doctors/data/sr-1/gimhyoju.json"
            "seocho/doctors/data/sr-1/jeongdahong.json"
            "seocho/doctors/data/sr-2/_index.json"
            "seocho/doctors/data/sr-2/guhaein.json"
            "seocho/doctors/data/sr-2/coejimin.json"
            "seocho/doctors/data/sr-2/hanjuyeol.json"
            "seocho/doctors/data/di-1/_index.json"
            "seocho/doctors/data/di-1/isoyun.json"
            "seocho/doctors/data/di-1/jojuhyi.json"
            "seocho/doctors/data/di-2/_index.json"
            "seocho/doctors/data/di-2/gangyurim.json"
            "seocho/doctors/data/di-2/eomharim.json"
            "seocho/doctors/data/di-2/iyeongeun.json"
            "seocho/doctors/data/di-3/_index.json"
            "seocho/doctors/data/di-3/gimyunji.json"
            "seocho/doctors/data/di-3/gimhyejin.json"
            "seocho/doctors/data/em-1/_index.json"
            "seocho/doctors/data/em-1/hansangjin.json"
            "seocho/doctors/data/em-1/gimjonggyeong.json"
            "seocho/doctors/data/op/_index.json"
            "seocho/doctors/data/op/gimyujin.json"
            "seocho/doctors/data/is-1/_index.json"
            "seocho/doctors/data/is-1/jeongjeongyun.json"
            "seocho/doctors/data/gp-2/_index.json"
            "seocho/doctors/data/gp-2/gimyumin.json"
            "seocho/doctors/data/gp-2/baggimseohyeon.json"
            "seocho/doctors/data/gp-2/igyeongsu.json"
            "seocho/doctors/data/gp-2/gimjaehyeon.json"
            "about/bg-video.mp4"
            "about/cert-modal/modal.css"
            "about/cert-modal/modal.js"
            "global/floating-cta.css"
            "global/floating-cta.js"
          )
          FAILED=0
          for f in "${FILES[@]}"; do
            printf "Purging @${REF}/%s → " "$f"
            code=$(curl -s -o /tmp/purge_out.txt -w "%{http_code}" "${BASE}/${f}")
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              echo "  body: $(cat /tmp/purge_out.txt)"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "⚠️ 퍼지 실패 ${FAILED}건 — bootstrap.js는 드물게 변경되므로 보통 괜찮음"
          else
            echo "✅ bootstrap.js 캐시 퍼지 완료 (@${REF})"
          fi

      - name: Warm up jsDelivr for new commit SHA
        run: |
          # jsDelivr 은 SHA URL 을 lazy 인덱싱. 사용자 도달 전 미리 fetch 해서
          # 즉시 200 OK 보장.
          SHA="${{ github.sha }}"
          BASE="https://cdn.jsdelivr.net/gh/pookat73-prog/helixamc-webflow@${SHA}"
          FILES=(
            "global/ga4-base.js"
            "global/ga-inspector.js"
            "global/global.css"
            "global/floating-cta.css"
            "global/floating-cta.js"
            "global/scroll-depth.js"
            "global/popup.css"
            "global/popup.js"
            "home/bootstrap-v3.js"
            "home/section1/section1.css"
            "home/section1/section1.js"
            "home/section-divider/divider.css"
            "home/section-divider/divider.js"
            "home/global/buttons.css"
            "home/global/buttons.js"
            "home/global/sections-animations.css"
            "home/global/sections-animations.js"
            "home/global/coming-soon.css"
            "home/global/coming-soon.js"
            "home/global/hamburger.css"
            "home/global/hamburger.js"
            "home/global/footer.css"
            "home/global/footer.js"
            "home/global/card-stack.css"
            "home/global/card-stack.js"
            "home/equipment/equipment.js"
            "about/about.css"
            "about/about.js"
            "about/cert-modal/modal.css"
            "about/cert-modal/modal.js"
            "seocho/seocho.css"
            "seocho/seocho.js"
            "seocho/doctors/modal.css"
            "seocho/doctors/modal.js"
            "seocho/doctors/card-render.js"
            "seocho/doctors/data/_all.json"
            "emergency/emergency.css"
            "emergency/emergency.js"
            "emergency/modal.css"
            "emergency/modal.js"
            "emergency/renewal-bar.css"
            "emergency/renewal-bar.js"
          )
          # 참고: seocho/doctors/data/<group>/<slug>.json (의료진 28명) 은 클릭
          # 시점에 lazy fetch — 페이지 로드 차단 안 함. 첫 클릭 시 jsDelivr lazy
          # 인덱싱 약간 지연 가능하나, 두번째 클릭부터 캐시 hit. 일괄 워밍업
          # 비용 vs 이득 작아 생략.
          FAILED=0
          for f in "${FILES[@]}"; do
            printf "Warming /%s → " "$f"
            code=$(curl -s -o /dev/null -w "%{http_code}" "${BASE}/${f}")
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              FAILED=$((FAILED + 1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "⚠️ $FAILED 파일 워밍업 실패 — 재시도..."
            sleep 15
            FAILED2=0
            for f in "${FILES[@]}"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "${BASE}/${f}")
              if [ "$code" != "200" ]; then
                echo "  여전히 실패: $f (HTTP $code)"
                FAILED2=$((FAILED2 + 1))
              fi
            done
            if [ $FAILED2 -gt 0 ]; then
              echo "⚠️ 재시도 후에도 $FAILED2 파일 미인덱싱"
            else
              echo "✅ 재시도 후 워밍업 완료"
            fi
          else
            echo "✅ 모든 콘텐츠 파일 jsDelivr 워밍업 완료"
          fi

      - name: Summary
        if: always()
        run: |
          REF="${{ steps.ref.outputs.branch }}"
          {
            echo "## ✅ Webflow CDN Auto Deploy"
            echo ""
            echo "**대상 ref**: \`@${REF}\`"
            echo "**커밋**: \`${{ github.sha }}\`"
            echo ""
            if [ "$REF" = "staging" ]; then
              echo "→ Webflow 스테이징 사이트(\`*.webflow.io\`)에만 반영됨. 정식 사이트는 무영향."
            else
              echo "→ 정식 사이트에 반영됨."
            fi
            echo ""
            echo "---"
            echo ""
            echo "### 📌 배포 흐름"
            echo ""
            echo "- 개발 작업 → \`staging\` 브랜치 머지 → 스테이징 사이트 검증"
            echo "- 검증 OK → \`staging\` → \`main\` 머지(PR) → 정식 반영"
            echo ""
            echo "bootstrap.js 가 hostname 으로 분기:"
            echo "- \`*.webflow.io\` (스테이징 도메인) → \`@staging\` 로드"
            echo "- 그 외 (정식 도메인) → \`@main\` 로드"
            echo ""
            echo "### 📌 **최초 1회만** Webflow 양 사이트 모두 동일 head code 사용:"
            echo ""
            echo '```html'
            cat /tmp/head_cdn.txt 2>/dev/null || echo "<!-- main 배포 시 생성됨 -->"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
