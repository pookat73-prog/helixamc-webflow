<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Hexagon Animation Playground</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d1117;
    color: #e6edf3;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* 좌측 고정 컨트롤 패널 */
  .panel {
    position: fixed;
    top: 12px; left: 12px;
    width: 280px;
    max-height: calc(100vh - 24px);
    overflow: auto;
    background: rgba(20, 25, 35, .92);
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px 14px;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .panel h3 { margin: 0 0 8px; font-size: 13px; color: #58a6ff; }
  .panel .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .panel label { flex: 0 0 110px; font-size: 12px; color: #8b949e; }
  .panel input[type=range] { flex: 1; }
  .panel .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: #c9d1d9; }
  .panel button {
    margin-top: 10px; width: 100%;
    background: #1f6feb; color: #fff; border: 0; padding: 8px;
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  .panel .hint { font-size: 11px; color: #6e7681; margin-top: 8px; }

  /* 다이어그램 핀 영역 — 우측 절반 */
  .stage {
    margin-left: 320px;
  }
  .box {
    height: 100vh;
    border-bottom: 1px dashed #30363d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #6e7681;
    position: relative;
  }
  .box::before {
    content: attr(data-label);
    position: absolute; left: 24px; top: 24px;
    font-size: 12px; color: #58a6ff; font-weight: 400;
  }
  .box.box1 { background: linear-gradient(180deg, #0d1117, #11161e); }
  .box.box2 { background: linear-gradient(180deg, #11161e, #0d1117); }
  .box.box3 { background: linear-gradient(180deg, #0d1117, #161b24); }
  .box.spacer { background: #0a0d12; }

  /* 다이어그램 컨테이너 */
  .diagram-place-holder {
    width: 50vw;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
  }
  .helix-hex-diagram path {
    fill: rgba(0, 117, 214, .12);
    stroke: #0075d6;
    stroke-width: 2;
  }
  .helix-hex-diagram text {
    fill: #c9d1d9;
    font-family: -apple-system, sans-serif;
    font-weight: 700;
  }
  .helix-hex-diagram .hex { transform-box: fill-box; }

  /* HUD */
  .hud {
    position: fixed; bottom: 12px; right: 12px;
    background: rgba(20, 25, 35, .9);
    border: 1px solid #30363d; border-radius: 6px;
    padding: 8px 12px; font-size: 12px;
    font-variant-numeric: tabular-nums;
    z-index: 100;
  }
  .hud span { color: #58a6ff; }
</style>
</head>
<body>

<div class="panel">
  <h3>Hexagon Animation Playground</h3>

  <div class="row">
    <label>ROW_STEP</label>
    <input id="rowStep" type="range" min="60" max="180" value="110" step="2">
    <span class="val" id="rowStepV">110</span>
  </div>
  <div class="row">
    <label>ROW_SCALE</label>
    <input id="rowScale" type="range" min="0.3" max="1" value="0.6" step="0.02">
    <span class="val" id="rowScaleV">0.60</span>
  </div>
  <div class="row">
    <label>COMP gap (vw)</label>
    <input id="compVw" type="range" min="0" max="3" value="0.3" step="0.05">
    <span class="val" id="compVwV">0.30</span>
  </div>
  <div class="row">
    <label>TILT_Y (deg)</label>
    <input id="tiltY" type="range" min="0" max="60" value="32" step="1">
    <span class="val" id="tiltYV">32</span>
  </div>

  <h3 style="margin-top:14px">Spread (펼침)</h3>
  <div class="row">
    <label>start trigger</label>
    <select id="spreadStart">
      <option value="box1|center center" selected>box1 center center</option>
      <option value="box1|top center">box1 top center</option>
      <option value="box1|top top">box1 top top</option>
    </select>
  </div>
  <div class="row">
    <label>end trigger</label>
    <select id="spreadEnd">
      <option value="box2|top center">box2 top center</option>
      <option value="box2|center center">box2 center center</option>
      <option value="box3|top center" selected>box3 top center</option>
      <option value="box3|center center">box3 center center</option>
    </select>
  </div>

  <h3 style="margin-top:14px">Stack (켜켜이)</h3>
  <div class="row">
    <label>trigger box</label>
    <select id="stackTrigger">
      <option value="box2">box2</option>
      <option value="box3" selected>box3</option>
    </select>
  </div>
  <div class="row">
    <label>start</label>
    <select id="stackStart">
      <option value="top center" selected>top center</option>
      <option value="top top">top top</option>
    </select>
  </div>
  <div class="row">
    <label>end</label>
    <select id="stackEnd">
      <option value="bottom center" selected>bottom center</option>
      <option value="bottom top">bottom top</option>
      <option value="center center">center center</option>
    </select>
  </div>
  <div class="row">
    <label>front hex</label>
    <select id="frontHex">
      <option value="chikwa" selected>chikwa (rightmost)</option>
      <option value="ankwa">ankwa (leftmost)</option>
      <option value="yeongsang">yeongsang (center)</option>
    </select>
  </div>

  <button id="apply">Apply / Rebuild</button>
  <button id="dump" style="background:#30363d;margin-top:6px">Dump config to console</button>

  <div class="hint">스크롤 내려가며 확인. 값 바꾸면 Apply 눌러야 반영.</div>
</div>

<div class="hud">
  spread: <span id="spProg">0.00</span> &nbsp;
  stack: <span id="stProg">0.00</span> &nbsp;
  COMP_STEP_X: <span id="cspx">—</span>
</div>

<div class="stage">
  <div class="box spacer" data-label="(spacer)" style="height:50vh">scroll ↓</div>
  <div class="box box1" data-label="box1">box 1</div>
  <div class="box box2" data-label="box2">box 2</div>
  <div class="box box3" data-label="box3">
    <div class="diagram-place-holder"></div>
  </div>
  <div class="box spacer" data-label="(spacer)" style="height:120vh">end</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* ─── 헥사 다이어그램 렌더 (about.js 와 동일) ─── */
function renderHex(holder) {
  holder.innerHTML = '';
  var s = 100, sqrt3 = Math.sqrt(3), w = sqrt3 * s;
  var hexes = [
    { id: 'naekwa',    label: '내과',       cx: w * 0.5, cy: -1.5 * s },
    { id: 'oikwa',     label: '외과',       cx: w * 1.5, cy: -1.5 * s },
    { id: 'ankwa',     label: '안과',       cx: 0,       cy: 0 },
    { id: 'yeongsang', label: '영상의학과', cx: w,       cy: 0 },
    { id: 'chikwa',    label: '치과',       cx: w * 2,   cy: 0 }
  ];
  var minX = -w/2, maxX = w*2 + w/2, minY = -1.5*s - s, maxY = s, pad = 8;
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class','helix-hex-diagram');
  svg.setAttribute('viewBox', (minX-pad)+' '+(minY-pad)+' '+(maxX-minX+pad*2)+' '+(maxY-minY+pad*2));
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.style.width='100%'; svg.style.height='100%'; svg.style.overflow='visible';

  function verts(cx,cy){
    return [
      [cx, cy-s],[cx+w/2, cy-s/2],[cx+w/2, cy+s/2],
      [cx, cy+s],[cx-w/2, cy+s/2],[cx-w/2, cy-s/2]
    ];
  }
  function path(v){
    return 'M'+v[0][0]+' '+v[0][1]+
      ' L'+v[1][0]+' '+v[1][1]+
      ' L'+v[2][0]+' '+v[2][1]+
      ' L'+v[3][0]+' '+v[3][1]+
      ' L'+v[4][0]+' '+v[4][1]+
      ' L'+v[5][0]+' '+v[5][1]+' Z';
  }

  hexes.forEach(function(hx){
    var g = document.createElementNS(ns,'g');
    g.setAttribute('class','hex hex-'+hx.id);
    var p = document.createElementNS(ns,'path');
    p.setAttribute('d', path(verts(hx.cx, hx.cy)));
    g.appendChild(p);
    var t = document.createElementNS(ns,'text');
    t.setAttribute('x', hx.cx); t.setAttribute('y', hx.cy);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size', 22);
    t.textContent = hx.label;
    g.appendChild(t);
    svg.appendChild(g);
  });
  holder.appendChild(svg);
  return { svg: svg, hexes: hexes };
}

/* ─── 빌드 ─── */
var triggers = [];
function build() {
  triggers.forEach(function(t){ t.kill(); });
  triggers = [];

  var holder = document.querySelector('.diagram-place-holder');
  var rendered = renderHex(holder);
  var svg = rendered.svg;
  var hexes = rendered.hexes;

  var cfg = {
    ROW_STEP:  +document.getElementById('rowStep').value,
    ROW_SCALE: +document.getElementById('rowScale').value,
    COMP_VW:   +document.getElementById('compVw').value,
    TILT_Y:    +document.getElementById('tiltY').value,
    spreadStart: document.getElementById('spreadStart').value.split('|'),
    spreadEnd:   document.getElementById('spreadEnd').value.split('|'),
    stackTrigger:document.getElementById('stackTrigger').value,
    stackStart:  document.getElementById('stackStart').value,
    stackEnd:    document.getElementById('stackEnd').value,
    frontHex:    document.getElementById('frontHex').value
  };

  var s = 100, sqrt3 = Math.sqrt(3), w = sqrt3 * s;
  var ROW_CENTER_X = w; /* yeongsang cx */
  var ROW_Y = -75;
  var ROW_ORDER = ['ankwa','naekwa','yeongsang','oikwa','chikwa'];

  /* COMP_STEP_X = COMP_VW vw → viewBox units */
  var rect = svg.getBoundingClientRect();
  var vb = svg.viewBox.baseVal;
  var pxPerUnit = rect.width / vb.width;
  var compStepX = (window.innerWidth * cfg.COMP_VW / 100) / pxPerUnit;
  document.getElementById('cspx').textContent = compStepX.toFixed(2);

  var spreadTl = gsap.timeline({ paused: true });
  var stackTl  = gsap.timeline({ paused: true });

  ROW_ORDER.forEach(function(id, i){
    var hx = hexes.find(function(h){ return h.id === id; });
    var g = svg.querySelector('.hex-' + id);
    if (!hx || !g) return;

    var rowX = ROW_CENTER_X + (i - 2) * cfg.ROW_STEP;
    var rowDx = rowX - hx.cx;
    var rowDy = ROW_Y - hx.cy;
    var mergeDx = (ROW_CENTER_X + (i - 2) * compStepX) - hx.cx;

    spreadTl.fromTo(g,
      { x: 0, y: 0, scale: 1 },
      { x: rowDx, y: rowDy, scale: cfg.ROW_SCALE, duration: 1, ease: 'power2.inOut',
        immediateRender: false, svgOrigin: hx.cx + ' ' + hx.cy }, 0);

    var hexEnter = gsap.timeline({ defaults: { svgOrigin: hx.cx + ' ' + hx.cy }});
    hexEnter.to(g, { rotationY: cfg.TILT_Y, duration: 0.6, ease: 'power2.inOut' }, 0);
    hexEnter.to(g, { x: mergeDx, duration: 1.0, ease: 'power2.inOut' }, 0.6);
    hexEnter.to(g, { rotationY: 0, duration: 0.6, ease: 'power2.inOut' }, 1.6);
    stackTl.add(hexEnter, 0);
  });

  /* z-order — frontHex 가 최상단 */
  stackTl.call(function(){
    var order = ROW_ORDER.slice().filter(function(id){ return id !== cfg.frontHex; });
    order.push(cfg.frontHex);
    order.forEach(function(id){
      var g = svg.querySelector('.hex-' + id);
      if (g && g.parentNode) g.parentNode.appendChild(g);
    });
  }, null, 0.55);

  function refOf(name) {
    return document.querySelector('.' + name);
  }

  var spreadST = ScrollTrigger.create({
    trigger: refOf(cfg.spreadStart[0]),
    endTrigger: refOf(cfg.spreadEnd[0]),
    start: cfg.spreadStart[1],
    end:   cfg.spreadEnd[1],
    scrub: 1,
    animation: spreadTl,
    onUpdate: function(self){ document.getElementById('spProg').textContent = self.progress.toFixed(2); }
  });

  var stackST = ScrollTrigger.create({
    trigger: refOf(cfg.stackTrigger),
    start: cfg.stackStart,
    end:   cfg.stackEnd,
    scrub: 1,
    animation: stackTl,
    onUpdate: function(self){ document.getElementById('stProg').textContent = self.progress.toFixed(2); }
  });

  triggers.push(spreadST, stackST);
  window.__cfg = cfg;
  console.log('[playground] built', cfg);
}

/* ─── 슬라이더 라이브 표시 ─── */
['rowStep','rowScale','compVw','tiltY'].forEach(function(id){
  var inp = document.getElementById(id);
  var v   = document.getElementById(id + 'V');
  inp.addEventListener('input', function(){
    var n = +inp.value;
    v.textContent = (id === 'rowScale' || id === 'compVw') ? n.toFixed(2) : n;
  });
});

document.getElementById('apply').addEventListener('click', build);
document.getElementById('dump').addEventListener('click', function(){
  console.log(JSON.stringify(window.__cfg, null, 2));
});

window.addEventListener('load', build);
window.addEventListener('resize', function(){
  clearTimeout(window.__rb);
  window.__rb = setTimeout(build, 200);
});
</script>
</body>
</html>
