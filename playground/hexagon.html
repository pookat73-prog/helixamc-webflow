<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Hex 5단계 플레이그라운드</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --blue: #0075d6;
  --purple: #5528aa;
  --text: #e6edf3;
  --muted: #8b949e;
}
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── 캔버스 ── */
#canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  perspective: 800px;
}
#hex-wrap {
  width: min(60vw, 480px);
  aspect-ratio: 2 / 1.4;
  position: relative;
}
#hex-wrap svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* 헥사곤 기본 스타일 — about 페이지와 동일 */
.hex path {
  fill: #f4f7fb;
  stroke: #0075d6;
  stroke-width: 0.7;
  stroke-linecap: butt;
  stroke-linejoin: miter;
  vector-effect: non-scaling-stroke;
}
.hex text {
  fill: #0075d6;
  font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
  font-weight: 400;
  pointer-events: none;
  user-select: none;
}
.hex-naekwa text, .hex-oikwa text, .hex-yeongsang text { font-weight: 700; }
.hex { transform-box: fill-box; transform-origin: center; }

/* Stage 5 요소 */
.s5-symbol { opacity: 0; }
.s5-arc    { opacity: 0; fill: none; stroke: var(--blue); stroke-width: 2; }
.s5-arc2   { opacity: 0; fill: none; stroke: rgba(255,255,255,.35); stroke-width: 1.5; }

/* ── 하단 내비 ── */
#nav {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.nav-btn {
  background: var(--border);
  border: 0;
  color: var(--text);
  padding: 8px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background .15s;
}
.nav-btn:hover { background: #444c56; }
.nav-btn:disabled { opacity: .3; cursor: default; }
.dots {
  display: flex;
  gap: 8px;
  flex: 1;
  justify-content: center;
}
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--border);
  cursor: pointer;
  transition: background .2s, transform .2s;
  border: 0;
}
.dot.active { background: var(--blue); transform: scale(1.3); }
#stage-label {
  font-size: 13px;
  color: var(--muted);
  min-width: 220px;
  text-align: right;
}

/* ── 우측 컨트롤 패널 ── */
#panel {
  position: fixed;
  right: 12px; top: 12px;
  width: 240px;
  background: rgba(22,27,34,.95);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 12px;
  backdrop-filter: blur(8px);
  z-index: 10;
}
#panel h4 { color: var(--blue); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.row label { flex: 0 0 90px; color: var(--muted); }
.row input[type=range] { flex: 1; }
.row .v { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.sep { border-top: 1px solid var(--border); margin: 10px 0; }
#apply-btn {
  width: 100%; background: var(--blue); color: #fff;
  border: 0; padding: 7px; border-radius: 5px;
  cursor: pointer; font-weight: 600; font-size: 12px;
  margin-top: 8px;
}
</style>
</head>
<body>

<div id="canvas">
  <div id="hex-wrap"><!-- SVG 여기 --></div>
</div>

<nav id="nav">
  <button class="nav-btn" id="prev-btn">← 이전</button>
  <div class="dots" id="dots"></div>
  <div id="stage-label"></div>
  <button class="nav-btn" id="next-btn">다음 →</button>
</nav>

<aside id="panel">
  <h4>Stage 파라미터</h4>

  <div id="ctrl-s1">
    <div style="color:var(--muted);font-size:12px;line-height:1.6">
      어바웃 페이지 Section 1<br>허니컴 배열 등장 완료 상태<br>
      <span style="color:var(--blue)">fill #f4f7fb · stroke #0075d6</span>
    </div>
  </div>
  <div id="ctrl-s2" style="display:none">
    <div class="row"><label>겹침 (px)</label><input id="s2-step" type="range" min="40" max="140" value="80" step="2"><span class="v" id="s2-stepV">80</span></div>
    <div class="row"><label>스케일</label><input id="s2-scale" type="range" min=".4" max="1" value=".62" step=".01"><span class="v" id="s2-scaleV">.62</span></div>
  </div>
  <div id="ctrl-s3" style="display:none">
    <div style="color:var(--muted);font-size:12px;line-height:1.6">
      가운데 완전 겹침<br>헥사곤 → 원 페이드<br>텍스트 페이드 아웃
    </div>
  </div>
  <div id="ctrl-s4" style="display:none">
    <div class="row"><label>가로 스케일</label><input id="s4-sx" type="range" min=".3" max="1.2" value=".95" step=".01"><span class="v" id="s4-sxV">.95</span></div>
    <div class="row"><label>세로 스케일</label><input id="s4-sy" type="range" min=".02" max=".5" value=".18" step=".01"><span class="v" id="s4-syV">.18</span></div>
  </div>
  <div id="ctrl-s5" style="display:none">
    <div class="row"><label>심볼 크기</label><input id="s5-sym" type="range" min=".5" max="2" value="1" step=".05"><span class="v" id="s5-symV">1.0</span></div>
    <div class="row"><label>호 반지름</label><input id="s5-arc" type="range" min="60" max="300" value="150" step="5"><span class="v" id="s5-arcV">150</span></div>
  </div>

  <div class="sep"></div>
  <button id="apply-btn">적용</button>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
/* ─────── 헥사 메타 ─────── */
var s = 100, sq3 = Math.sqrt(3), w = sq3 * s;
var META = {
  ankwa:    { cx: 0,      cy: 0 },
  naekwa:   { cx: w*.5,   cy: -1.5*s },
  yeongsang:{ cx: w,      cy: 0 },
  oikwa:    { cx: w*1.5,  cy: -1.5*s },
  chikwa:   { cx: w*2,    cy: 0 }
};
var ORDER = ['ankwa','naekwa','yeongsang','oikwa','chikwa'];
var CX = w;           /* 클러스터 가로 중심 */
var CY = -0.6*s;      /* 클러스터 세로 중심 */
var ns = 'http://www.w3.org/2000/svg';

/* ─────── 경로 생성 (전역) ─────── */
function hexBezierPath(cx, cy) {
  var vx = [], vy = [];
  for (var i = 0; i < 6; i++) {
    var a = -Math.PI/2 + i * Math.PI/3;
    vx.push(cx + s * Math.cos(a));
    vy.push(cy + s * Math.sin(a));
  }
  var d = 'M ' + vx[0].toFixed(3) + ' ' + vy[0].toFixed(3);
  for (var i = 0; i < 6; i++) {
    var nx = vx[(i+1)%6], ny = vy[(i+1)%6];
    var c1x = vx[i] + (nx-vx[i])/3,  c1y = vy[i] + (ny-vy[i])/3;
    var c2x = vx[i] + 2*(nx-vx[i])/3, c2y = vy[i] + 2*(ny-vy[i])/3;
    d += ' C '+c1x.toFixed(3)+' '+c1y.toFixed(3)+' '+c2x.toFixed(3)+' '+c2y.toFixed(3)+' '+nx.toFixed(3)+' '+ny.toFixed(3);
  }
  return d + ' Z';
}

function circleBezierPath(cx, cy) {
  var k = 4/3 * Math.tan(Math.PI/12);
  var vx = [], vy = [];
  for (var i = 0; i < 6; i++) {
    var a = -Math.PI/2 + i * Math.PI/3;
    vx.push(cx + s * Math.cos(a));
    vy.push(cy + s * Math.sin(a));
  }
  var d = 'M ' + vx[0].toFixed(3) + ' ' + vy[0].toFixed(3);
  for (var i = 0; i < 6; i++) {
    var a0 = -Math.PI/2 + i * Math.PI/3;
    var a1 = -Math.PI/2 + (i+1) * Math.PI/3;
    var nx = vx[(i+1)%6], ny = vy[(i+1)%6];
    var c1x = vx[i] - k*s*Math.sin(a0), c1y = vy[i] + k*s*Math.cos(a0);
    var c2x = nx   + k*s*Math.sin(a1),  c2y = ny   - k*s*Math.cos(a1);
    d += ' C '+c1x.toFixed(3)+' '+c1y.toFixed(3)+' '+c2x.toFixed(3)+' '+c2y.toFixed(3)+' '+nx.toFixed(3)+' '+ny.toFixed(3);
  }
  return d + ' Z';
}

/* ─────── SVG 생성 ─────── */
function mkSvg() {
  var wrap = document.getElementById('hex-wrap');
  wrap.innerHTML = '';
  var pad = 60;
  var vbX = -w/2 - pad, vbY = -1.5*s - s - pad;
  var vbW = w*2 + w + pad*2, vbH = 1.5*s + s*2 + pad*2;
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox', vbX+' '+vbY+' '+vbW+' '+vbH);
  svg.setAttribute('overflow','visible');
  svg.id = 'the-svg';

  var LABELS = { ankwa:'안과', naekwa:'내과', yeongsang:'영상의학과', oikwa:'외과', chikwa:'치과' };

  ORDER.forEach(function(id){
    var hx = META[id];
    var g = document.createElementNS(ns,'g');
    g.setAttribute('class','hex hex-'+id);

    var p = document.createElementNS(ns,'path');
    p.setAttribute('d', hexBezierPath(hx.cx, hx.cy));
    p.setAttribute('class','hex-path');
    g.appendChild(p);

    var t = document.createElementNS(ns,'text');
    t.setAttribute('x', hx.cx);
    t.setAttribute('y', hx.cy);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('dominant-baseline', 'central');
    t.setAttribute('font-size', '22');
    t.textContent = LABELS[id];
    g.appendChild(t);

    svg.appendChild(g);
  });

  /* Stage 5 요소 */
  var sym = mkHelixSymbol(CX, CY-10);
  sym.setAttribute('class','s5-symbol');
  svg.appendChild(sym);

  var arc = document.createElementNS(ns,'circle');
  arc.setAttribute('class','s5-arc');
  arc.setAttribute('cx', CX); arc.setAttribute('cy', CY-10);
  arc.setAttribute('r','150');
  arc.id = 'arc1';
  svg.appendChild(arc);

  var arc2 = document.createElementNS(ns,'circle');
  arc2.setAttribute('class','s5-arc2');
  arc2.setAttribute('cx', CX); arc2.setAttribute('cy', CY-10);
  arc2.setAttribute('r','110');
  arc2.id = 'arc2';
  svg.appendChild(arc2);

  wrap.appendChild(svg);
}

function mkHelixSymbol(cx, cy) {
  var g = document.createElementNS(ns,'g');
  /* 두 교차 S-커브 = 간략화된 DNA 헬릭스 */
  var r = 55, h = 130;
  function strand(flip) {
    var p = document.createElementNS(ns,'path');
    var x1 = cx - r*(flip?-1:1), y1 = cy - h/2;
    var x2 = cx + r*(flip?-1:1), y2 = cy + h/2;
    var cp1x = cx + r*(flip?1:-1)*1.6, cp1y = cy - h/4;
    var cp2x = cx - r*(flip?1:-1)*1.6, cp2y = cy + h/4;
    p.setAttribute('d','M'+x1+' '+y1+' C'+cp1x+' '+cp1y+' '+cp2x+' '+cp2y+' '+x2+' '+y2);
    p.setAttribute('fill','none');
    p.setAttribute('stroke', flip ? 'rgba(255,255,255,.8)' : 'var(--blue,#0075d6)');
    p.setAttribute('stroke-width','3.5');
    p.setAttribute('stroke-linecap','round');
    return p;
  }
  /* 가로 연결선 (rungs) */
  [-50,-16,18,52].forEach(function(dy){
    var rung = document.createElementNS(ns,'line');
    var t = (dy + 60) / 120; /* 0~1 */
    var phase = Math.sin(t * Math.PI) * r * 1.3;
    rung.setAttribute('x1', cx - phase*.6); rung.setAttribute('y1', cy+dy);
    rung.setAttribute('x2', cx + phase*.6); rung.setAttribute('y2', cy+dy);
    rung.setAttribute('stroke','rgba(255,255,255,.35)');
    rung.setAttribute('stroke-width','1.5');
    g.appendChild(rung);
  });
  g.appendChild(strand(false));
  g.appendChild(strand(true));
  return g;
}

/* ─────── 단계 정의 ─────── */
var STAGE_NAMES = [
  '1 — 올림픽 링 클러스터 (허니컴 + 겹침, 텍스트 없음)',
  '2 — 가로 일렬, 서로 살짝 겹침',
  '3 — 켜켜이 가로 모임',
  '4 — 완전 겹침 + 가로로 누움',
  '5 — 심볼 통과 + 호 그리기'
];

function getCompStepX(vw) {
  var svg = document.getElementById('the-svg');
  if (!svg) return 26;
  var r = svg.getBoundingClientRect();
  var vb = svg.viewBox.baseVal;
  if (!r.width || !vb.width) return 26;
  return (window.innerWidth * vw / 100) / (r.width / vb.width);
}

function applyStage(n, dur) {
  dur = dur === undefined ? 0.55 : dur;
  var svg = document.getElementById('the-svg');
  if (!svg) return;

  /* 공용: 헥사 복원 — path 보임, circle 숨김, 텍스트 보임 */
  ORDER.forEach(function(id) {
    var g = svg.querySelector('.hex-'+id);
    gsap.to(g, { opacity: 1, rotationX: 0, scaleX: 1, scaleY: 1, duration: dur, overwrite: 'auto' });
    /* path 를 헥사곤으로 복원 + 텍스트 복원 */
    var hxm = META[id];
    gsap.to(g.querySelector('.hex-path'), {
      attr: { d: hexBezierPath(hxm.cx, hxm.cy) },
      duration: dur * 0.5, overwrite: 'auto'
    });
    gsap.to(g.querySelector('text'), { opacity: 1, duration: dur * 0.5, overwrite: 'auto' });
  });
  /* stage5 요소 숨김 기본 */
  gsap.to(svg.querySelector('.s5-symbol'), { opacity: 0, duration: dur*.5 });
  gsap.to(svg.querySelector('#arc1'),       { opacity: 0, duration: dur*.5 });
  gsap.to(svg.querySelector('#arc2'),       { opacity: 0, duration: dur*.5 });
  /* svg container rotateX 리셋 */
  gsap.to(document.getElementById('hex-wrap'), { rotationX: 0, duration: dur });

  if (n === 0) applyS1(svg, dur);
  else if (n === 1) applyS2(svg, dur);
  else if (n === 2) applyS3(svg, dur);
  else if (n === 3) applyS4(svg, dur);
  else if (n === 4) applyS5(svg, dur);

  /* 컨트롤 패널 전환 */
  ['s1','s2','s3','s4','s5'].forEach(function(k, i) {
    document.getElementById('ctrl-'+k).style.display = i === n ? '' : 'none';
  });

  /* 단계 레이블 */
  document.getElementById('stage-label').textContent = STAGE_NAMES[n];

  /* 도트 */
  document.querySelectorAll('.dot').forEach(function(d,i){ d.classList.toggle('active', i===n); });
  document.getElementById('prev-btn').disabled = n === 0;
  document.getElementById('next-btn').disabled = n === 4;
}

/* Stage 1: 어바웃 페이지 Section 1 최종 모습 — 허니컴 원위치, scale 1 */
function applyS1(svg, dur) {
  ORDER.forEach(function(id) {
    var hx = META[id];
    var g = svg.querySelector('.hex-'+id);
    gsap.to(g, {
      x: 0, y: 0,
      scale: 1, rotation: 0, rotationY: 0, opacity: 1,
      duration: dur, ease: 'power2.inOut',
      svgOrigin: hx.cx + ' ' + hx.cy,
      overwrite: 'auto'
    });
  });
}

/* Stage 2: 가로 일렬, 겹침 */
function applyS2(svg, dur) {
  var step  = +document.getElementById('s2-step').value;
  var scale = +document.getElementById('s2-scale').value;
  var rowY  = CY;
  ORDER.forEach(function(id, i) {
    var hx = META[id];
    var g = svg.querySelector('.hex-'+id);
    var tx = CX + (i - 2) * step;
    gsap.to(g, {
      x: tx - hx.cx, y: rowY - hx.cy,
      scale: scale, rotation: 0, rotationY: 0,
      duration: dur, ease: 'power2.inOut',
      svgOrigin: hx.cx + ' ' + hx.cy,
      overwrite: 'auto'
    });
  });
}

var S3_MAIN = 'yeongsang'; /* 중심에 남을 대표 원 */

/* Stage 3: 가운데 완전 겹침 → 대표 원 1개만 남기고 나머지 페이드 아웃 */
function applyS3(svg, dur) {
  var targetCircle = circleBezierPath(CX, CY);

  ORDER.forEach(function(id) {
    var g = svg.querySelector('.hex-'+id);
    var p = g.querySelector('.hex-path');

    gsap.to(g, {
      x: 0, y: 0, scale: 1, scaleX: 1, scaleY: 1, rotation: 0, rotationY: 0,
      duration: dur, ease: 'power2.inOut', overwrite: 'auto'
    });
    gsap.to(p, {
      attr: { d: targetCircle },
      duration: dur * 0.85, ease: 'power2.inOut', overwrite: 'auto'
    });
    gsap.to(g.querySelector('text'), { opacity: 0, duration: dur * 0.4, ease: 'power2.in', overwrite: 'auto' });

    /* 대표 원 제외 나머지 — 모인 후 페이드 아웃 */
    if (id !== S3_MAIN) {
      gsap.to(g, { opacity: 0, duration: dur * 0.45, delay: dur * 0.55, ease: 'power2.in', overwrite: false });
    }
  });
}

/* Stage 4: 대표 원이 가로 타원으로 누우면서 나머지 4개가 뒤에서 흩어져 등장 */
/* 흩어지는 위치 (x:0, y:0 기준 — path가 CX,CY에 있으므로 화면상 CX+dx, CY+dy) */
var S4_SCATTER = {
  ankwa:    { dx: -190, dy:  40 },
  naekwa:   { dx:  -90, dy: -90 },
  oikwa:    { dx:   90, dy: -90 },
  chikwa:   { dx:  190, dy:  40 }
};

function applyS4(svg, dur) {
  var sx = +document.getElementById('s4-sx').value;
  var sy = +document.getElementById('s4-sy').value;
  var targetCircle = circleBezierPath(CX, CY);

  ORDER.forEach(function(id) {
    var g = svg.querySelector('.hex-'+id);
    var p = g.querySelector('.hex-path');

    /* path를 원으로 확보 */
    gsap.to(p, {
      attr: { d: targetCircle },
      duration: dur * 0.7, ease: 'power2.inOut', overwrite: 'auto'
    });
    gsap.to(g.querySelector('text'), { opacity: 0, duration: dur * 0.3, overwrite: 'auto' });

    if (id === S3_MAIN) {
      /* 대표 원 → 가로 타원으로 눕기 */
      gsap.to(g, {
        x: 0, y: 0, opacity: 1,
        scaleX: sx, scaleY: sy,
        rotation: 0, rotationY: 0,
        duration: dur, ease: 'power2.inOut',
        svgOrigin: CX + ' ' + CY, overwrite: 'auto'
      });
    } else {
      /* 나머지 4개 — 타원만 보여야 하므로 즉시 완전히 숨김 */
      gsap.to(g, { opacity: 0, duration: dur * 0.3, overwrite: 'auto' });
    }
  });
  gsap.to(document.getElementById('hex-wrap'), { rotationX: 0, duration: dur });
}

/* Stage 5: 심볼 + 호 */
function applyS5(svg, dur) {
  var symScale = +document.getElementById('s5-sym').value;
  var arcR     = +document.getElementById('s5-arc').value;

  /* 헥사 fade out (뒤로 빠짐) */
  ORDER.forEach(function(id) {
    var hx = META[id];
    var g = svg.querySelector('.hex-'+id);
    gsap.to(g, {
      x: CX - hx.cx, y: CY - hx.cy,
      scale: 0.55, opacity: 0.12, rotation: 0,
      duration: dur, ease: 'power2.inOut',
      svgOrigin: hx.cx + ' ' + hx.cy,
      overwrite: 'auto'
    });
  });

  /* 심볼 등장 */
  var sym = svg.querySelector('.s5-symbol');
  gsap.set(sym, { scale: symScale, svgOrigin: CX + ' ' + (CY-10) });
  gsap.to(sym, { opacity: 1, duration: dur, ease: 'power2.out', delay: dur * .3 });

  /* 호 */
  var a1 = svg.querySelector('#arc1');
  var a2 = svg.querySelector('#arc2');
  a1.setAttribute('r', arcR);
  a2.setAttribute('r', arcR * 0.73);
  var circ1 = 2 * Math.PI * arcR;
  var circ2 = 2 * Math.PI * arcR * 0.73;
  gsap.set(a1, { attr: { 'stroke-dasharray': circ1+' '+circ1, 'stroke-dashoffset': circ1 } });
  gsap.set(a2, { attr: { 'stroke-dasharray': circ2+' '+circ2, 'stroke-dashoffset': -circ2 } });
  gsap.to(a1, { opacity: 1, attr: { 'stroke-dashoffset': 0 }, duration: dur*1.2, ease: 'power2.out', delay: dur*.1 });
  gsap.to(a2, { opacity: 1, attr: { 'stroke-dashoffset': 0 }, duration: dur*1.2, ease: 'power2.out', delay: dur*.25 });
}

/* ─────── 내비게이션 ─────── */
var cur = 0;

function goTo(n) {
  if (n < 0 || n > 4) return;
  cur = n;
  applyStage(cur);
}

document.getElementById('prev-btn').addEventListener('click', function(){ goTo(cur-1); });
document.getElementById('next-btn').addEventListener('click', function(){ goTo(cur+1); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(cur+1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(cur-1);
});

/* 도트 생성 */
var dotsEl = document.getElementById('dots');
for (var di = 0; di < 5; di++) {
  (function(i){
    var b = document.createElement('button');
    b.className = 'dot'; b.title = STAGE_NAMES[i];
    b.addEventListener('click', function(){ goTo(i); });
    dotsEl.appendChild(b);
  })(di);
}

/* 슬라이더 라이브 값 표시 */
[['s2-step','s2-stepV',0],['s2-scale','s2-scaleV',2],
 ['s4-sx','s4-sxV',2],['s4-sy','s4-syV',2],
 ['s5-sym','s5-symV',1],['s5-arc','s5-arcV',0]
].forEach(function(t){
  var inp = document.getElementById(t[0]);
  var out = document.getElementById(t[1]);
  inp.addEventListener('input', function(){ out.textContent = (+inp.value).toFixed(t[2]); });
});

document.getElementById('apply-btn').addEventListener('click', function(){
  applyStage(cur, 0.55);
});

/* ─────── 초기화 ─────── */
mkSvg();
/* GSAP 초기 상태: 원래 허니컴 위치 */
ORDER.forEach(function(id) {
  var hx = META[id];
  var g = document.querySelector('.hex-'+id);
  gsap.set(g, { x: 0, y: 0, scale: 1, rotation: 0, svgOrigin: hx.cx+' '+hx.cy });
});
goTo(0);
</script>
</body>
