  <defs>
    <style>
      .cls-1 {
        fill: #ffffff;
      }

      .cls-2 {
        mask: url(#mask);
      }

      .cls-3 {
        fill: #ffffff;
      }

      .cls-4 {
        fill: #040000;
      }

      .cls-5 {
        filter: url(#luminosity-noclip);
      }
    </style>
    <filter id="luminosity-noclip" x="1.58" y="89.41" width="355.44" height="130.52" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-color="#fff" result="bg"/>
      <feBlend in="SourceGraphic" in2="bg"/>
    </filter>
    <mask id="mask" x="1.58" y="89.41" width="355.44" height="130.52" maskUnits="userSpaceOnUse">
      <g class="cls-5">
        <polygon class="cls-4" points="14.39 181.35 7.28 181.35 1.58 144.49 7.98 130.82 58.79 89.41 136.93 101.34 158.49 111.4 152.3 127.27 124.12 141.5 81.64 146.62 42.14 140.22 14.39 181.35"/>
      </g>
    </mask>
    <!-- 다이컷(아이싱 쿠키/아크릴 스탠드 굿즈) — 솔리드 채움 버전.
         1) close(dilate→erode)로 내부 빈 구멍을 메운 솔리드 실루엣 생성
         2) 그 실루엣을 흰색으로 채워 베이스(안쪽 꽉 참)
         3) 베이스를 더 dilate 해 도톰한 흰 외곽선
         4) 외곽선 → 솔리드 베이스 → 원본 아트 순으로 합성 -->
    <filter id="diecut" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="30" result="c1"/>
      <feMorphology in="c1" operator="erode" radius="30" result="filled"/>
      <feFlood flood-color="#ffffff" result="w"/>
      <feComposite in="w" in2="filled" operator="in" result="base"/>
      <feMorphology in="filled" operator="dilate" radius="14" result="outl"/>
      <feComposite in="w" in2="outl" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="base"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
